<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CSR Impact Evaluation Platform — Astha Deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Vintage yellow palette */
  --bg:#FDF6C3;
  --bg2:#F5E64A;
  --bg3:#EDD832;
  --text:#0A0800;
  --text2:#3A3200;
  --text3:#6B5C00;
  --border:rgba(10,8,0,0.22);
  --border2:rgba(10,8,0,0.45);
  --accent:#0A0800;
  --accent-bg:#F5E64A;
  --accent-dark:#0A0800;
  /* Flags - dark chips on yellow */
  --red-bg:#7A0000;   --red-t:#FDF6C3;
  --amber-bg:#5C3800; --amber-t:#FDF6C3;
  --green-bg:#1A3D00; --green-t:#FDF6C3;
  --blue-bg:#0A0800;  --blue-t:#F5E64A;
  --purple-bg:#2D0050;--purple-t:#FDF6C3;
  --gray-bg:#3A3200;  --gray-t:#FDF6C3;
  --r:4px;--rs:2px;
}
html,body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg3);
  color:var(--text);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
}

/* ── TOP NAV ── */
.topnav{
  position:sticky;top:0;z-index:200;
  background:var(--text);
  border-bottom:2px solid var(--text);
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.5rem;gap:1rem;
}
.tnbrand-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bg2);margin-bottom:3px}
.tnbrand-name{font-size:15px;font-weight:700;color:#FDF6C3;font-family:'Playfair Display',Georgia,serif;letter-spacing:.01em}
.tntabs{display:flex;gap:3px;background:rgba(255,255,255,0.08);padding:3px;border-radius:2px}
.tntab{
  font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;
  padding:5px 14px;border-radius:1px;border:none;
  background:transparent;color:rgba(253,246,195,0.55);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.tntab.on{background:var(--bg2);color:var(--text)}
.tntab:hover:not(.on){color:#FDF6C3}
.tncart{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(253,246,195,0.6)}
.cart-count-badge{background:var(--bg2);color:var(--text);font-size:11px;font-weight:700;padding:2px 9px;border-radius:1px;min-width:24px;text-align:center}

/* ── PAGE ── */
.page{max-width:1000px;margin:0 auto;padding:1.25rem 1.25rem 6rem}
.view{display:none}.view.on{display:block}

/* ── FILTER BAR ── */
.filterbar{
  background:var(--bg);border:1.5px solid var(--text);
  border-radius:var(--r);padding:.875rem 1.25rem;
  margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.filterbar input[type=text]{
  flex:1;min-width:160px;font-family:inherit;font-size:13px;font-weight:500;
  padding:6px 12px;border:1.5px solid var(--text);border-radius:var(--rs);
  background:var(--bg);color:var(--text);outline:none;
}
.filterbar input::placeholder{color:var(--text3)}
.filterbar input:focus{background:var(--bg2)}
.filter-group{display:flex;gap:4px;flex-wrap:wrap}
.fchip{
  font-size:11px;font-weight:700;letter-spacing:.03em;
  padding:4px 11px;border-radius:1px;
  border:1.5px solid var(--text);background:var(--bg);
  color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.fchip:hover{background:var(--bg2)}
.fchip.on{background:var(--text);color:var(--bg2)}

/* ── NGO GRID ── */
.ngo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:720px){.ngo-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.ngo-grid{grid-template-columns:1fr}}
.ngocard{
  background:var(--bg);border:1.5px solid var(--text);
  border-radius:var(--r);padding:.875rem 1rem;
  display:flex;flex-direction:column;gap:7px;
  transition:background .15s;
}
.ngocard:hover{background:var(--bg2)}
.ngocard.incart{background:var(--text);border-color:var(--text)}
.ngocard.incart .card-name{color:#FDF6C3}
.ngocard.incart .card-loc{color:rgba(253,246,195,0.6)}
.ngocard.incart .card-stats span{color:rgba(253,246,195,0.7)}
.ngocard.incart .cart-btn{background:var(--bg2);color:var(--text);border-color:var(--bg2)}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:1.5px solid currentColor}
.card-meta{flex:1;min-width:0}
.card-name{font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-loc{font-size:11px;color:var(--text2);margin-top:1px}
.card-stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:11px;color:var(--text2)}
.score-row{display:flex;align-items:center;gap:8px}
.sbar{flex:1;height:4px;border-radius:0;background:rgba(10,8,0,0.15);overflow:hidden}
.sbf{height:100%;border-radius:0}
.score-num{font-size:12px;font-weight:700;font-family:'DM Mono',monospace;min-width:30px;text-align:right}
.cart-btn{
  font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.03em;
  padding:5px 10px;border-radius:var(--rs);
  border:1.5px solid var(--text);background:var(--bg2);
  color:var(--text);cursor:pointer;transition:all .15s;width:100%;
}
.cart-btn:hover{background:var(--text);color:var(--bg2)}
.empty-state{grid-column:1/-1;text-align:center;padding:3rem;color:var(--text3);font-size:14px}

/* ── TAGS ── */
.ptag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:1px;display:inline-block;white-space:nowrap;flex-shrink:0;letter-spacing:.03em}
.edu{background:var(--text);color:var(--bg2)}
.live{background:var(--green-bg);color:var(--green-t)}
.mix{background:var(--purple-bg);color:var(--purple-t)}
.geo{background:rgba(10,8,0,0.10);color:var(--text);border:1px solid var(--border)}

/* ── FLAGS ── */
.fl{font-size:10px;font-weight:700;padding:2px 8px;border-radius:1px;display:inline-block;margin:1px;letter-spacing:.02em}
.fH{background:var(--red-bg);color:var(--red-t)}
.fM{background:var(--amber-bg);color:var(--amber-t)}
.fOK{background:var(--green-bg);color:var(--green-t)}

/* ── CART BAR ── */
#cartBar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--text);border-top:2px solid var(--text);
  padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  transform:translateY(100%);transition:transform .25s;z-index:100;
}
#cartBar.visible{transform:translateY(0)}
.cart-summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cart-names{font-size:12px;color:rgba(253,246,195,0.65);max-width:500px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-actions{display:flex;gap:8px;flex-shrink:0}
button.primary{
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.03em;
  padding:7px 18px;border-radius:var(--rs);border:2px solid var(--bg2);
  background:var(--bg2);color:var(--text);cursor:pointer;transition:all .15s;
}
button.primary:hover{background:transparent;color:var(--bg2)}
button.secondary{
  font-family:inherit;font-size:13px;font-weight:700;
  padding:7px 14px;border-radius:var(--rs);
  border:2px solid var(--bg2);background:transparent;
  color:var(--bg2);cursor:pointer;transition:all .15s;
}
button.secondary:hover{background:var(--bg2);color:var(--text)}
button:disabled{opacity:.35;cursor:default}

/* ── EVAL SHELL ── */
.eval-shell{background:var(--bg);border:1.5px solid var(--text);border-radius:var(--r);overflow:hidden}
.eval-header{padding:1.25rem 1.5rem 1rem;border-bottom:1.5px solid var(--text);display:flex;justify-content:space-between;align-items:flex-end;background:var(--text)}
.eval-header > div:first-child > div:first-child{color:var(--bg2)}
.eval-header > div:first-child > div:nth-child(2){color:#FDF6C3;font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700}
.eval-header > div:first-child > div:nth-child(3){color:rgba(253,246,195,0.65);font-size:12px}
.eval-header > div:last-child{color:rgba(253,246,195,0.65);text-align:right;font-size:11px;line-height:1.9}
#evalNgoCount{color:#FDF6C3;font-size:15px;font-weight:700}
.eval-body{padding:1.5rem}
.sp{display:none}.sp.on{display:block}

/* PROGRESS */
#prog{display:flex;align-items:flex-start;margin-bottom:1.75rem}
.pgstep{display:flex;flex-direction:column;align-items:center;min-width:36px}
.pgdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--text);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text);flex-shrink:0;transition:all .25s;background:var(--bg)}
.pgdot.on{background:var(--text);color:var(--bg2)}
.pgdot.done{background:var(--text);color:var(--bg2)}
.pglbl{font-size:10px;font-weight:500;color:var(--text3);text-align:center;margin-top:3px;white-space:nowrap}
.pglbl.on{color:var(--text);font-weight:700}
.pgline{flex:1;height:1.5px;background:var(--text);margin:0 4px;margin-bottom:14px;opacity:.25}

/* EVAL CARDS */
.met-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.met{background:var(--text);border-radius:var(--rs);padding:.75rem 1rem;text-align:center}
.met-val{font-size:20px;font-weight:700;font-family:'DM Mono',monospace;color:var(--bg2)}
.met-lbl{font-size:11px;color:rgba(253,246,195,0.65);margin-top:2px;font-weight:500}
.card{background:var(--bg);border:1.5px solid var(--text);border-radius:var(--r);padding:.875rem 1.125rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem}
.three-col{display:grid;grid-template-columns:190px 1fr;gap:1.5rem;align-items:start}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.wrow{display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.wrow:last-child{border-bottom:none}
input[type=range]{width:100%;accent-color:var(--text);cursor:pointer}

/* SCORE MATRIX */
.sgrid{display:grid}
.shd{font-size:11px;font-weight:700;color:var(--text2);padding:5px 4px;text-align:center;border-left:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdim{font-size:11px;font-weight:500;color:var(--text2);padding:6px 0;border-top:1px solid var(--border)}
.scel{text-align:center;padding:5px 3px;font-size:12px;font-weight:700;border-left:1px solid var(--border);border-top:1px solid var(--border);border-radius:2px;margin:1px}
.stot{text-align:center;padding:6px 4px;font-size:12px;font-weight:700;border-left:1.5px solid var(--text);border-top:2px solid var(--text);font-family:'DM Mono',monospace}
.scH{background:var(--green-bg);color:var(--green-t)}
.scM{background:var(--amber-bg);color:var(--amber-t)}
.scL{background:var(--red-bg);color:var(--red-t)}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 8px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--text);border-bottom:2px solid var(--text);white-space:nowrap;text-transform:uppercase;background:var(--bg2)}
td{padding:6px 8px;color:var(--text);border-bottom:1px solid var(--border)}
tr:nth-child(even) td{background:rgba(245,230,74,0.15)}

/* REC CARDS */
.rec-card{border-radius:var(--r);border:1.5px solid var(--text);background:var(--bg);padding:.875rem 1.125rem;margin-bottom:10px}
.rec-card.sel-card{background:var(--text);border-color:var(--text)}
.rec-card.sel-card p,.rec-card.sel-card div{color:#FDF6C3 !important}
.rec-card.sel-card .ptag.edu{background:var(--bg2);color:var(--text)}
.rec-card.sel-card .fl.fOK{background:var(--bg2);color:var(--text)}
.rec-card.notrec{opacity:.55}
.nav-bar{display:flex;justify-content:space-between;align-items:center;margin-top:1.75rem;padding-top:1rem;border-top:1.5px solid var(--border)}

/* ── IMPACT SHELL ── */
.impact-shell{background:var(--bg);border:1.5px solid var(--text);border-radius:var(--r);overflow:hidden}
.impact-subnav{display:flex;gap:0;border-bottom:1.5px solid var(--text);overflow-x:auto;background:var(--bg2)}
.sntab{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;padding:.875rem 1.25rem;border:none;background:none;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;text-transform:uppercase}
.sntab.on{color:var(--text);border-bottom-color:var(--text);background:var(--bg)}
.sntab:hover:not(.on){background:rgba(10,8,0,0.08)}
.impact-panel{display:none;padding:1.5rem}
.impact-panel.on{display:block}
.impact-intro{font-size:13px;color:var(--text2);margin-bottom:1.25rem;line-height:1.7}

/* MAP */
#mapWrap{position:relative;border-radius:var(--rs);overflow:hidden;background:var(--bg2);border:1.5px solid var(--text)}
#mapSvg{width:100%;display:block}
.map-legend{display:flex;gap:16px;margin-top:.75rem;flex-wrap:wrap}
.map-leg-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--text2)}
.map-leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--text)}
.map-tooltip{position:fixed;background:var(--text);border:1.5px solid var(--text);border-radius:var(--rs);padding:8px 12px;font-size:12px;pointer-events:none;display:none;z-index:500;color:#FDF6C3}
.map-layout{display:grid;grid-template-columns:1fr 240px;gap:1rem;align-items:start}
.map-sidebar{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto}
.map-ngo-item{background:var(--bg2);border-radius:var(--rs);padding:.625rem .875rem;border:1px solid var(--border);cursor:default}
.map-filter{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap}

/* SDG MATRIX */
.sdg-wrap{overflow-x:auto}
.sdg-table{border-collapse:collapse;font-size:12px;min-width:100%}
.sdg-table th{padding:6px 8px;font-size:10px;font-weight:700;color:var(--text);border-bottom:2px solid var(--text);white-space:nowrap;text-align:center;background:var(--bg2);text-transform:uppercase;letter-spacing:.04em}
.sdg-table th:first-child{text-align:left;min-width:200px}
.sdg-table td{padding:7px;text-align:center;border-top:1px solid var(--border)}
.sdg-table td:first-child{text-align:left;font-size:11px;font-weight:600;color:var(--text)}
.sdg-badge{width:28px;height:28px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1px solid rgba(0,0,0,0.2)}
.sdg-dot-p{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid rgba(0,0,0,0.2)}
.sdg-dot-s{width:8px;height:8px;border-radius:50%;display:inline-block;opacity:.45;border:1px solid rgba(0,0,0,0.15)}
.sdg-legend{display:flex;gap:16px;margin-top:.75rem;font-size:11px;color:var(--text2);flex-wrap:wrap;font-weight:500}
.sdg-leg{display:flex;align-items:center;gap:5px}

/* THEORY OF CHANGE */
.toc-selector{display:flex;gap:8px;margin-bottom:1.25rem}
.toc-btn{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 18px;border-radius:1px;border:2px solid var(--text);background:var(--bg);color:var(--text);cursor:pointer;transition:all .15s}
.toc-btn.on{background:var(--text);color:var(--bg2)}
.toc-btn:hover:not(.on){background:var(--bg2)}

/* INDICATORS */
.ind-tabs{display:flex;gap:6px;margin-bottom:1rem}
.ind-tab{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 16px;border-radius:1px;border:2px solid var(--text);background:var(--bg);color:var(--text);cursor:pointer;transition:all .15s}
.ind-tab.on{background:var(--text);color:var(--bg2)}
.ind-tab:hover:not(.on){background:var(--bg2)}
.ind-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ind-card{background:var(--bg);border:1.5px solid var(--text);border-radius:var(--r);padding:1rem 1.125rem}
.ind-title{font-size:13px;font-weight:700;margin-bottom:.25rem}
.ind-meta{font-size:11px;color:var(--text2);margin-bottom:.75rem;font-weight:500}
.ind-bar-wrap{margin-bottom:6px}
.ind-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:500}
.ind-bar-track{height:7px;border-radius:0;background:rgba(10,8,0,0.12);overflow:hidden;border:1px solid rgba(10,8,0,0.15)}
.ind-bar-fill{height:100%;border-radius:0;transition:width .6s}
.ind-source{font-size:10px;color:var(--text3);margin-top:.5rem;font-weight:500;letter-spacing:.02em}

/* ── EVAL EMPTY STATE ── */
#evalEmptyState{text-align:center;padding:3rem;background:var(--bg);border-radius:var(--r);border:1.5px solid var(--text)}
color:var(--text3);margin-top:.5rem}
</style>
</head>
<body>

<noscript><div style="font-family:Georgia,serif;text-align:center;padding:3rem;background:#FDF6C3;color:#0A0800"><h2>JavaScript required</h2><p style="margin-top:1rem">Please enable JavaScript to use the CSR Evaluation Platform.</p></div></noscript>
<div id="pageLoader" style="position:fixed;inset:0;background:#EDD832;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:1rem">
  <div style="font-family:Georgia,serif;font-size:22px;font-weight:700;color:#0A0800">Astha Deep</div>
  <div style="font-size:13px;color:#3A3200;font-weight:600;letter-spacing:.06em;text-transform:uppercase">CSR Evaluation Platform</div>
  <div style="width:48px;height:3px;background:#0A0800;margin-top:.5rem;animation:ldbar 1.2s ease-in-out infinite alternate"></div>
</div>
<style>
@keyframes ldbar{from{width:24px;opacity:.4}to{width:72px;opacity:1}}
</style>

<!-- TOP NAV -->
<nav class="topnav">
  <div class="tnbrand">
    <div class="tnbrand-label">Astha Deep</div>
    <div class="tnbrand-name">CSR Evaluation Platform</div>
  </div>
  <div class="tntabs">
    <button class="tntab on" onclick="showView('discover',this)"><i class="ti ti-search" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>Discover</button>
    <button class="tntab" onclick="showView('evaluate',this)"><i class="ti ti-clipboard-check" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>Evaluate</button>
    <button class="tntab" onclick="showView('impact',this)"><i class="ti ti-map-2" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>Impact Assessment</button>
  </div>
  <div class="tncart">
    <span style="color:var(--text2);font-size:12px">Cart</span>
    <span class="cart-count-badge" id="navCartBadge">0</span>
  </div>
</nav>

<!-- ══ DISCOVER VIEW ══ -->
<div id="discoverView" class="view on">
<div class="page">
  <div class="filterbar">
    <input type="text" id="searchInput" placeholder="Search by name, location, or programme…" oninput="applyFilters()"/>
    <div class="filter-group" id="stateFilters">
      <div class="fchip on" data-val="all" onclick="setFilter('state',this)">All states</div>
      <div class="fchip" data-val="KA" onclick="setFilter('state',this)">Karnataka</div>
      <div class="fchip" data-val="MH" onclick="setFilter('state',this)">Maharashtra</div>
      <div class="fchip" data-val="both" onclick="setFilter('state',this)">Pan-India</div>
    </div>
    <div class="filter-group" id="themeFilters">
      <div class="fchip on" data-val="all" onclick="setFilter('theme',this)">All themes</div>
      <div class="fchip" data-val="edu" onclick="setFilter('theme',this)">Education</div>
      <div class="fchip" data-val="live" onclick="setFilter('theme',this)">Livelihoods</div>
      <div class="fchip" data-val="mix" onclick="setFilter('theme',this)">Mixed</div>
    </div>
    <div class="filter-group" id="sizeFilters">

// VIEW SWITCHING
function showView(v,tabEl){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  document.getElementById(v+'View').classList.add('on');
  document.querySelectorAll('.tntab').forEach(t=>t.classList.remove('on'));
  if(tabEl) tabEl.classList.add('on');
  else{const tabs=document.querySelectorAll('.tntab');const map={discover:0,evaluate:1,impact:2};const idx=map[v];if(idx!==undefined)tabs[idx].classList.add('on');}

  if(v==='impact'&&!mapInited){setTimeout(()=>{initMap();buildSdgMatrix('all');buildToc('edu');buildInd('edu');},100);}
}

// FILTERS
function setFilter(type,el){
  document.querySelectorAll('#'+type+'Filters .fchip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  activeFilters[type]=el.dataset.val;
  applyFilters();
}
function applyFilters(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const visible=ALL_NGOS.filter(n=>{
    if(activeFilters.state!=='all'&&n.state!==activeFilters.state)return false;
    if(activeFilters.theme!=='all'&&n.theme!==activeFilters.theme)return false;
    if(activeFilters.size!=='all'&&sizeOf(n)!==activeFilters.size)return false;
    if(activeFilters.fcra==='active'&&n.fcra!=='Active')return false;
    if(q&&!n.name.toLowerCase().includes(q)&&!n.hq.toLowerCase().includes(q)&&!n.prog.toLowerCase().includes(q))return false;
    return true;
  });
  document.getElementById('ngoCount').textContent=visible.length+' NGOs';
  renderGrid(visible);
}

    const ws=wScore(n).toFixed(1);const wsf=parseFloat(ws);

      <span style="color:var(--text2);font-size:11px"><i class="ti ti-map-pin" style="font-size:11px"></i> ${n.hq}, ${n.state==='both'?'KA+MH':n.state}</span>
      <span style="font-size:11px"><i class="ti ti-certificate" style="font-size:11px"></i> <span style="color:${n.fcra==='Active'?'#1D9E75':'#BA7517'}">${n.fcra}</span></span>

}
function clearCart(){cart.clear();updateCartBar();applyFilters();document.getElementById('navCartBadge').textContent=0;}
function updateCartBar(){

  bar.classList.add('visible');

  const names=ALL_NGOS.filter(ng=>cart.has(ng.id)).map(ng=>ng.short).join(' · ');

function refreshEval(){
  const ec=document.getElementById('evalContent');
  const ee=document.getElementById('evalEmptyState');
  if(cart.size===0){ec.style.display='none';ee.style.display='block';return;}
  ec.style.display='block';ee.style.display='none';
  evalNgos=ALL_NGOS.filter(ng=>cart.has(ng.id)).sort((a,b)=>wScore(b)-wScore(a));
  cur=1;chartInst=null;
  document.querySelectorAll('.sp').forEach((el,i)=>el.classList.toggle('on',i===0));

  const sorted=[...evalNgos].sort((a,b)=>wScore(b)-wScore(a));
  const selected=[],conditional=[],notRec=[];
  sorted.forEach(n=>{const ws=wScore(n);const hasHigh=n.flags.some(f=>f.sev==='H');if(hasHigh)notRec.push(n);else if(ws>=8.0)selected.push(n);else if(ws>=7.0)conditional.push(n);else notRec.push(n);});
  sorted.forEach(n=>{
    const ws=wScore(n);const hasHigh=n.flags.some(f=>f.sev==='H');
    const inSel=selected.includes(n);const inCond=conditional.includes(n);
    const div=document.createElement('div');div.className='rec-card'+(inSel?' sel-card':notRec.includes(n)?' notrec':'');
    const badge=hasHigh?`<span class="fl fH">Not recommended</span>`:inSel?`<span class="fl fOK">Selected</span>`:`<span class="fl fM">Conditional</span>`;
    const rationale=hasHigh?`Excluded — ${n.flags.filter(f=>f.sev==='H').map(f=>f.text.split('—')[0].trim()).join('; ')}`:ws>=9?'Exceptional scores. Anchor partner recommended.':ws>=8?'Strong across all dimensions. Low compliance risk.':ws>=7?'Solid programme quality. Minor gaps manageable via MOU conditions.':'Score below 7.0 threshold.';
    div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><p style="font-size:13px;font-weight:500;margin:0">${n.name}</p>${badge}</div><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="ptag ${n.theme}">${n.themeLabel}</span><span class="ptag geo">${n.hq}</span></div></div><div style="text-align:right"><div style="font-size:20px;font-weight:500;font-family:'DM Mono',monospace;color:${ws>=8?'#1D9E75':ws>=7?'#BA7517':'#A32D2D'}">${ws.toFixed(2)}</div><div style="font-size:10px;color:var(--text2)">/ 10.00</div></div></div><p style="margin:8px 0 0;font-size:12px;color:var(--text2)">${rationale}</p>`;
    c.appendChild(div);
  });
  const at=document.getElementById('allocTable');const allRec=[...selected,...conditional];
  if(!allRec.length){at.innerHTML='<p style="font-size:13px;color:var(--text2)">No partners meet the minimum threshold. Refine your shortlist.</p>';return;}
  let html=`<table><thead><tr>`;['Partner','Allocation','Theme','Status','Note'].forEach(h=>html+=`<th>${h}</th>`);html+=`</tr></thead><tbody>`;
  allRec.forEach((n,i)=>{const isC=conditional.includes(n);const share=isC?0.5:Math.max(0.5,(8*(1-0.5*conditional.length/allRec.length)/Math.max(selected.length,1)));html+=`<tr><td style="font-weight:500">${n.name}</td><td style="font-weight:500;font-family:'DM Mono',monospace;color:#1D9E75">₹${share.toFixed(1)} Cr</td><td><span class="ptag ${n.theme}">${n.themeLabel}</span></td><td><span class="fl ${isC?'fM':'fOK'}">${isC?'Conditional':'Selected'}</span></td><td style="font-size:11px;color:var(--text2)">${isC?'Subject to MOU compliance conditions':'Clean compliance, strong score'}</td></tr>`;});
  html+=`</tbody></table>`;at.innerHTML=html;
  document.getElementById('allocTotals').innerHTML=`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--text2)">Locked</span><span style="font-weight:500">${selected.length} partners</span></div><div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--text2)">Conditional</span><span style="font-weight:500">${conditional.length} partners</span></div>`;
}

function nav(d){
  cur=Math.max(1,Math.min(5,cur+d));
  document.querySelectorAll('.sp').forEach((el,i)=>el.classList.toggle('on',i+1===cur));
  document.getElementById('sl').textContent=`Step ${cur} of 5`;
  document.getElementById('pb').disabled=cur===1;document.getElementById('nb').disabled=cur===5;
  buildProgress();
  if(cur===2)buildProfiles();if(cur===3){buildWeightControls();buildScoreMatrix();buildScoreChart();}if(cur===4)buildFinTable();if(cur===5)buildRec();
}

function switchImpact(panel,tabEl){
  document.querySelectorAll('.sntab').forEach(t=>t.classList.remove('on'));

// MAP
function setMapFilter(f,el){
  mapFilter=f;
  document.querySelectorAll('#ip-geo .map-filter .fchip:not([data-val])').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  renderMapDots();renderMapSidebar();
}
function setMapTheme(t,el){
  mapTheme=t;
  ['all','edu','live','mix'].forEach(v=>document.getElementById('mt-'+v)&&document.getElementById('mt-'+v).classList.remove('on'));
  el.classList.add('on');
  renderMapDots();renderMapSidebar();
}
function getMapNgos(){
  let ngos=ALL_NGOS;
  if(mapFilter==='cart')ngos=ngos.filter(n=>cart.has(n.id));
  if(mapTheme!=='all')ngos=ngos.filter(n=>n.theme===mapTheme);
  return ngos;
}
let projFn=null;
function initMap(){
  mapInited=true;
  const svg=d3.select('#mapSvg');
  const w=580,h=620;
  const proj=d3.geoMercator().center([80,22]).scale(950).translate([w/2,h/2+60]);
  projFn=proj;
  const path=d3.geoPath().projection(proj);
  const isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  d3.json('https://cdn.jsdelivr.net/npm/datamaps@0.5.10/src/js/data/ind.topo.json').then(india=>{
    const key=Object.keys(india.objects)[0];
    const features=topojson.feature(india,india.objects[key]).features;
    svg.selectAll('path.state').data(features).join('path').attr('class','state')
      .attr('d',path)
      .attr('fill',d=>{
        const name=(d.properties.NAME_1||d.properties.name||d.properties.st_nm||'').toLowerCase();
        if(name.includes('karnataka'))return '#F5E64A';
        if(name.includes('maharashtra'))return '#EDD832';
        return '#f5f0d0';
      })
      .attr('stroke','rgba(10,8,0,0.18)')
      .attr('stroke-width',0.5);
    // State labels
    features.forEach(d=>{
      const name=(d.properties.NAME_1||d.properties.name||d.properties.st_nm||'');
      if(name.toLowerCase().includes('karnataka')||name.toLowerCase().includes('maharashtra')){
        const c=path.centroid(d);
        if(!isNaN(c[0])){
          svg.append('text').attr('x',c[0]).attr('y',c[1]).attr('text-anchor','middle').attr('font-size','9').attr('font-family','DM Sans,sans-serif').attr('fill','rgba(10,8,0,0.45)').attr('pointer-events','none').text(name.toLowerCase().includes('karnataka')?'Karnataka':'Maharashtra');
        }
      }
    });
    renderMapDots();renderMapSidebar();
  }).catch(()=>{
    svg.append('text').attr('x',290).attr('y',310).attr('text-anchor','middle').attr('font-size','13').attr('font-family','DM Sans,sans-serif').attr('fill','var(--text2)').text('Map loading failed — check network');
  });
}
function renderMapDots(){
  if(!projFn)return;
  const svg=d3.select('#mapSvg');
  svg.selectAll('circle.ngodot').remove();
  svg.selectAll('text.ngolabel').remove();
  const ngos=getMapNgos();
  const maxBene=Math.max(...ALL_NGOS.map(n=>n.beneNum));
  const isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const tip=document.getElementById('mapTooltip');
  ngos.forEach(n=>{
    const [x,y]=projFn([n.lon,n.lat]);
    if(isNaN(x))return;
    const r=Math.max(6,Math.min(20,6+14*(Math.log(n.beneNum)/Math.log(maxBene))));
    const col=THEME_COLOR[n.theme];
    svg.append('circle').attr('class','ngodot').attr('cx',x).attr('cy',y).attr('r',r).attr('fill',col+'BB').attr('stroke',col).attr('stroke-width',1.5).attr('cursor','pointer')
      .on('mousemove',(event)=>{tip.style.display='block';tip.style.left=(event.clientX+12)+'px';tip.style.top=(event.clientY-40)+'px';tip.innerHTML=`<strong style="font-size:13px;color:var(--bg2)">${n.name}</strong><br><span style="font-size:11px;color:var(--text2)">${n.hq} · ${n.themeLabel}</span><br><span style="font-size:11px">${n.bene} · ${n.budget}</span>`;})
      .on('mouseleave',()=>{tip.style.display='none';});
  });
}
function renderMapSidebar(){
  const sb=document.getElementById('mapSidebar');sb.innerHTML='';
  const ngos=getMapNgos();
  if(!ngos.length){sb.innerHTML='<p style="font-size:12px;color:var(--text3);padding:.5rem">No NGOs in view</p>';return;}
  ngos.forEach(n=>{
    const ws=wScore(n).toFixed(1);const wsf=parseFloat(ws);
    const div=document.createElement('div');div.className='map-ngo-item';
    div.innerHTML=`<div style="display:flex;align-items:center;gap:7px;margin-bottom:3px"><div style="width:8px;height:8px;border-radius:50%;background:${THEME_COLOR[n.theme]};flex-shrink:0"></div><span style="font-size:12px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.name}</span><span style="font-size:11px;font-family:'DM Mono',monospace;color:${wsf>=8?'#1D9E75':wsf>=7?'#BA7517':'#A32D2D'}">${ws}</span></div><div style="font-size:10px;color:var(--text2)">${n.hq} · ${n.bene}</div>`;
    sb.appendChild(div);
  });
}

// SDG MATRIX
function setSdgFilter(f,el){
  sdgFilter=f;
  document.querySelectorAll('#ip-sdg .fchip').forEach(c=>c.classList.remove('on'));el.classList.add('on');
  buildSdgMatrix(f);
}
function buildSdgMatrix(f){
  let ngos=ALL_NGOS;
  if(f==='cart')ngos=ngos.filter(n=>cart.has(n.id));
  else if(f==='edu'||f==='live')ngos=ngos.filter(n=>n.theme===f);
  const c=document.getElementById('sdgMatrix');
  let html=`<table class="sdg-table"><thead><tr><th style="position:sticky;left:0;background:var(--bg);z-index:2">SDG Goal</th>`;
  ngos.forEach(n=>html+=`<th title="${n.name}">${n.short}</th>`);
  html+=`</tr></thead><tbody>`;
  SDGS.forEach(sdg=>{
    html+=`<tr><td style="position:sticky;left:0;background:var(--bg);z-index:1"><div style="display:flex;align-items:center;gap:7px"><div class="sdg-badge" style="background:${sdg.color};color:#fff">${sdg.g}</div><span style="font-size:11px">SDG ${sdg.g}: ${sdg.label}</span></div></td>`;
    ngos.forEach(n=>{
      const match=n.sdgs.find(s=>s.g===sdg.g);
      if(match&&match.t==='p')html+=`<td><div class="sdg-dot-p" style="background:${sdg.color};margin:0 auto" title="Primary"></div></td>`;
      else if(match&&match.t==='s')html+=`<td><div class="sdg-dot-s" style="background:${sdg.color};margin:0 auto" title="Secondary"></div></td>`;
      else html+=`<td><span style="color:var(--text3);font-size:10px">—</span></td>`;
    });
    html+=`</tr>`;
  });
  // Coverage count row
  html+=`<tr style="border-top:1.5px solid var(--border2)"><td style="position:sticky;left:0;background:var(--bg2);font-weight:500;font-size:11px;z-index:1">SDG coverage</td>`;
  ngos.forEach(n=>{const cnt=n.sdgs.length;html+=`<td style="text-align:center;font-size:12px;font-weight:500;background:var(--bg2);font-family:'DM Mono',monospace">${cnt}</td>`;});
  html+=`</tr></tbody></table>`;
  c.innerHTML=html;
}
